<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi & Aspirasi MPK</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Alpine.js for simple logic -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', 'Poppins', sans-serif;
            background-color: #FDFCF8;
            color: #1f2937;
        }
        .radio-custom:checked + div {
            border-color: rgba(99, 102, 241, 0.4);
            background-color: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.05);
        }
        .radio-custom:checked + div .radio-badge {
            background-color: #6366f1;
            color: white;
            border-color: #6366f1;
        }
        .radio-custom:checked + div .radio-text {
            color: #111827;
            font-weight: 700;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            primary: '#6366f1',
                            secondary: '#f0f4ff',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body x-data="{ submitted: false, isSubmitting: false }">

    <div class="min-h-screen py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-4xl mx-auto space-y-12">
            
            <!-- Success State -->
            <template x-if="submitted">
                <div class="flex items-center justify-center py-20">
                    <div class="bg-white p-12 md:p-20 rounded-[50px] shadow-2xl shadow-indigo-500/5 border border-gray-50 max-w-3xl w-full text-center space-y-12 transition-all">
                        <div class="flex justify-center">
                            <div class="relative">
                                <div class="absolute inset-0 bg-emerald-50 rounded-full scale-150 opacity-40 animate-pulse"></div>
                                <div class="absolute inset-0 bg-emerald-50 rounded-full scale-125 opacity-60"></div>
                                <div class="relative w-24 h-24 rounded-full bg-emerald-50 flex items-center justify-center border-4 border-white shadow-sm text-emerald-500">
                                    <i data-lucide="check-circle-2" style="width: 48px; height: 48px; stroke-width: 2.5px;"></i>
                                </div>
                            </div>
                        </div>
                        <div class="space-y-6">
                            <h2 class="text-5xl font-black text-gray-800 tracking-tight">Aspirasi Terkirim!</h2>
                            <p class="italic text-gray-500 font-medium leading-relaxed text-lg max-w-2xl mx-auto">
                                "Terima kasih atas keberanianmu untuk bersuara. Kejujuranmu adalah bahan bakar utama bagi perkembangan MPK yang lebih harmonis."
                            </p>
                        </div>
                        <div class="pt-6">
                            <button @click="submitted = false" class="w-full bg-[#6366f1] text-white py-6 rounded-3xl font-bold shadow-xl shadow-indigo-100 hover:shadow-indigo-200 transition-all text-xl">
                                Kirim Tanggapan Lain
                            </button>
                        </div>
                        <p class="text-sm text-gray-400 font-medium tracking-wide">Identitas Anda tetap 100% rahasia.</p>
                    </div>
                </div>
            </template>

            <!-- Form State -->
            <template x-if="!submitted">
                <div class="space-y-12">
                    <!-- Header -->
                    <header class="flex flex-col items-center text-center space-y-6">
                        <img src="assets/mpk.png" alt="Logo MPK" class="w-32 h-32 object-contain" onerror="this.src='https://placehold.co/128x128?text=Logo+MPK'">
                        
                        <div class="inline-flex items-center gap-2 bg-[#F0F4FF] text-[#6366f1] px-4 py-1.5 rounded-full text-xs font-bold tracking-wider">
                            <i data-lucide="shield-check" style="width: 14px; height: 14px;"></i>
                            PROTECTED ANONYMOUS PORTAL
                        </div>

                        <div class="space-y-4">
                            <h1 class="text-4xl md:text-5xl font-bold text-gray-900 tracking-tight">Evaluasi & Aspirasi MPK</h1>
                            <p class="max-w-xl mx-auto text-gray-500 font-medium">Wadah kolaborasi pemikiran untuk transformasi organisasi yang lebih objektif dan inklusif.</p>
                        </div>
                    </header>

                    <form action="https://formspree.io/f/xrejokrd" method="POST" 
                        @submit.prevent="
                            isSubmitting = true;
                            fetch($el.action, {
                                method: 'POST',
                                body: new FormData($el),
                                headers: { 'Accept': 'application/json' }
                            }).then(response => {
                                if (response.ok) {
                                    submitted = true;
                                    window.scrollTo({ top: 0, behavior: 'smooth' });
                                } else {
                                    alert('Gagal mengirim. Silakan coba lagi.');
                                }
                            }).catch(() => {
                                alert('Terjadi kesalahan koneksi.');
                            }).finally(() => {
                                isSubmitting = false;
                            })
                        " class="space-y-10">

                        <!-- Catatan Penting -->
                        <div class="bg-[#F0F7FF] border border-[#D1E9FF] p-6 md:p-8 rounded-3xl space-y-4">
                            <div class="flex items-center gap-2 text-[#4A5568] font-bold">
                                <i data-lucide="info" class="text-[#6366f1]" style="width: 20px; height: 20px;"></i>
                                <span class="text-sm">CATATAN PENTING</span>
                            </div>
                            <ul class="space-y-3 text-sm text-[#4A5568] leading-relaxed">
                                <li class="flex gap-3"><span class="text-[#6366f1]">•</span><p>Survey ini bersifat <strong class="font-bold">100% ANONIM</strong>. Kami tidak merekam data pribadi, email, atau IP Anda.</p></li>
                                <li class="flex gap-3"><span class="text-[#6366f1]">•</span><p><strong class="font-bold">Pesan khusus untuk adik-adik kelas:</strong> Tidak perlu menggunakan kata sapaan \"Ka\" atau \"Kakak\" agar identitas terjaga.</p></li>
                                <li class="flex gap-3"><span class="text-[#6366f1]">•</span><p>Isilah form ini sejujur-jujurnya demi evaluasi objektif organisasi.</p></li>
                            </ul>
                        </div>

                        <!-- Section 1 -->
                        <div class="bg-white border border-gray-100 rounded-3xl shadow-sm overflow-hidden text-sm">
                            <div class="p-6 border-b border-gray-50 flex items-center gap-3">
                                <i data-lucide="user" class="text-[#6366f1]" style="width: 20px; height: 20px;"></i>
                                <h2 class="text-xs font-bold text-[#6366f1] uppercase tracking-widest">01. SURVEY KARAKTER & KEPEMIMPINAN</h2>
                            </div>
                            
                            <div class="p-8 space-y-10">
                                <!-- Q1 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Dalam situasi krisis, tipe kepemimpinan mana yang paling menggambarkan dirimu?</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q1" value="Memprioritaskan diskusi dan harmoni tim sebelum bertindak" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Memprioritaskan diskusi dan harmoni tim sebelum bertindak.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q1" value="Fokus pada perencanaan strategis dan delegasi tugas" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Fokus pada perencanaan strategis dan delegasi tugas.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q1" value="Mengambil inisiatif cepat dan memimpin di garis depan" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">C</div>
                                                <span class="radio-text text-gray-600">Mengambil inisiatif cepat dan memimpin di garis depan.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q1" value="Memberikan dukungan moral dan memantau dari belakang" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">D</div>
                                                <span class="radio-text text-gray-600">Memberikan dukungan moral dan memantau dari belakang.</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <!-- Q2 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Bagaimana reaksimu terhadap ide baru yang sangat berbeda dari biasanya?</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q2" value="Sangat menyukai tantangan dan ingin segera mencobanya" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Sangat menyukai tantangan dan ingin segera mencobanya.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q2" value="Menganalisis risiko dan manfaatnya terlebih dahulu" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Menganalisis risiko dan manfaatnya terlebih dahulu.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q2" value="Mengajaknya ke dalam forum untuk mencapai mufakat" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">C</div>
                                                <span class="radio-text text-gray-600">Mengajaknya ke dalam forum untuk mencapai mufakat.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q2" value="Mendukung ide tersebut jika selaras dengan nilai MPK" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">D</div>
                                                <span class="radio-text text-gray-600">Mendukung ide tersebut jika selaras dengan nilai MPK.</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <!-- Q3 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Pandanganmu terhadap kesuksesan sebuah program kerja adalah...</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q3" value="Tercapainya target bersama dengan suasana kekeluargaan" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Tercapainya target bersama dengan suasana kekeluargaan.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q3" value="Adanya proses pembelajaran bagi setiap anggota pelaksana" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Adanya proses pembelajaran bagi setiap anggota pelaksana.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q3" value="Eksekusi yang profesional dengan efisiensi tinggi" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">C</div>
                                                <span class="radio-text text-gray-600">Eksekusi yang profesional dengan efisiensi tinggi.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q3" value="Adanya dampak positif yang berkelanjutan bagi sekolah" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">D</div>
                                                <span class="radio-text text-gray-600">Adanya dampak positif yang berkelanjutan bagi sekolah.</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <!-- Q4 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Bagaimana cara terbaik menurutmu untuk memotivasi anggota yang mulai pasif?</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q4" value="Melakukan pendekatan personal dari hati ke hati" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Melakukan pendekatan personal dari hati ke hati.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q4" value="Memberikan tantangan baru yang sesuai minatnya" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Memberikan tantangan baru yang sesuai minatnya.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q4" value="Mengingatkan kembali tujuan awal masuk organisasi" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">C</div>
                                                <span class="radio-text text-gray-600">Mengingatkan kembali tujuan awal masuk organisasi.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q4" value="Melakukan evaluasi bersama dalam forum formal" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">D</div>
                                                <span class="radio-text text-gray-600">Melakukan evaluasi bersama dalam forum formal.</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <!-- Q5 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Apa yang kamu lakukan jika melihat ada kebijakan organisasi yang dirasa kurang tepat?</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q5" value="Menyampaikan kritik konstruktif melalui jalur resmi" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Menyampaikan kritik konstruktif melalui jalur resmi.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q5" value="Mencoba memahami latar belakang kebijakan tersebut lebih dalam" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Mencoba memahami latar belakang kebijakan tersebut lebih dalam.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q5" value="Mengajak rekan lain untuk berdiskusi mencari solusi alternatif" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">C</div>
                                                <span class="radio-text text-gray-600">Mengajak rekan lain untuk berdiskusi mencari solusi alternatif.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q5" value="Tetap menjalankan sambil menunggu waktu evaluasi tiba" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">D</div>
                                                <span class="radio-text text-gray-600">Tetap menjalankan sambil menunggu waktu evaluasi tiba.</span>
                                            </div>
                                        </label>
                                    </div>
                                </div>

                                <!-- Q6 -->
                                <div class="space-y-6">
                                    <h3 class="font-bold text-gray-800">Bagaimana sikapmu saat program kerja yang kamu susun tidak disetujui forum?</h3>
                                    <div class="grid gap-3">
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q6" value="Menerima masukan forum dan memperbaiki konsepnya" class="peer sr-only radio-custom" required>
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">A</div>
                                                <span class="radio-text text-gray-600">Menerima masukan forum dan memperbaiki konsepnya.</span>
                                            </div>
                                        </label>
                                        <label class="relative group cursor-pointer">
                                            <input type="radio" name="Q6" value="Meminta penjelasan mendalam untuk bahan evaluasi diri" class="peer sr-only radio-custom">
                                            <div class="flex items-center gap-4 p-5 rounded-[22px] border border-gray-100 bg-[#FBFBFA]/40 transition-all duration-300 group-hover:bg-gray-100/50">
                                                <div class="radio-badge flex-shrink-0 w-8 h-8 flex items-center justify-center rounded-lg bg-white border border-gray-100 text-[11px] font-bold text-[#6366f1] transition-all">B</div>
                                                <span class="radio-text text-gray-600">Meminta penjelasan mendalam untuk bahan evaluasi diri.</span>
